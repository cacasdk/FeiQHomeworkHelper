# 飞秋作业助手配置文件

# 通用配置
general:
  # 轮询间隔（秒）
  polling_interval: 5

# 飞秋消息抓取配置 (消息文件模式)
feiq:
  # 日志文件路径 (feiq.fql文件的完整路径)
  log_file_path: "c:\\Program Files\\feiq\\feiq.fql"
  # 日志文件编码
  log_file_encoding: "gbk"
  # 消息缓存大小（用于去重）
  max_cache_size: 100

# AI处理配置
ai:

  # API密钥（也可以通过环境变量OPENAI_API_KEY设置）
  api_key: ""
  # API端点
  api_endpoint: "https://api.openai.com/v1"
  # 模型名称
  model: "gpt-3.5-turbo"
  # 温度参数（0-1，越低越确定性，越高越创造性）
  temperature: 0.3
  # 最大生成令牌数
  max_tokens: 1000
  # 系统提示词
  system_prompt: |
    # 输入：
    你将获得2段文本，分别为messages与markdown
    其中，messages是消息日志其中可能带有乱码等不相关的信息，markdown是一个以Markdown格式写成的作业登记版
    你的任务是，从messages中提取出作业内容，并将其添加到markdown中
    # 输出：
    输出追加messages后的markdown，**如果其中没有作业内容，则输出"NOCHANGE"**
    # 要求：
    1. 从messages中提取出作业内容，不允许改变作业原话，仅可改变 格式，相关格式为：1. ......\n2. ......\n
    2. markdown中可能已经存在messages的科目title，请将追加文本放入到该title下
    3. 不允许改变其他科目内容，但可以覆盖自己科目的内容
    4. 输出时**仅输出**追加后的markdown，不要输出其他内容、提示 词
    5. 对于副科（除语文数学英语外）的作业，如果作业只有一条，则 无需序号，否则按照普通方式处理，如：物理只有一项作业，则 物 理：......\n
    # 示例：
    ##输入示例1：messages:
    X      测试用户       Carro   CARROTPC   00155D006F00?@ y   侭    测试用户 17:35:52
    y      测试用户       Carro   CARROTPC   00155D006F00?@ y   @€ 3     语文作业：
    1. 阅读《我爱飞秋》
    2. 默写第2课生词
    markdown:
    #12.3 作业
    ## 语文

    ## 输出示例1：
    #12.3 作业
    ## 语文
    1. 阅读《我爱飞秋》
    2. 默写第2课生词
    ##输入示例2：messages:
