# 飞秋作业助手配置文件

# 通用配置
general:
  # 轮询间隔（秒）
  polling_interval: 5

# 飞秋消息抓取配置 (HTTP 服务器模式)
feiq:
  # HTTP 服务器监听地址
  server_host: "127.0.0.1"
  # HTTP 服务器监听端口（需与 C++ 插件一致）
  server_port: 51914
  # 消息缓存大小
  max_cache_size: 100

# AI 处理配置
ai:
  # API 密钥（也可以通过环境变量 OPENAI_API_KEY 设置）
  api_key: ""
  # API 端点
  api_endpoint: "https://api.openai.com/v1"
  # 模型名称
  model: "gpt-3.5-turbo"
  # 温度参数（0-1，越低越确定性，越高越创造性）
  temperature: 0.3
  # 最大生成令牌数
  max_tokens: 1000
  # 系统提示词 - 可填写文件路径 (相对项目根目录) 或纯文本，留空则使用 config/default_prompt.txt
  system_prompt: "config/default_prompt.txt"
  # 最大重试次数
  max_retries: 3
  # 重试延迟（秒）
  retry_delay: 2

# Markdown 文件处理配置
markdown:
  # 目标文件路径 (相对项目根目录或绝对路径)
  file_path: "homework.md"
